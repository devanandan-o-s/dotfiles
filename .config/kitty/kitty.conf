# =============================================================================
# INK & CLOUD — KITTY
# Dark monochrome Japanese / cloud aesthetic
# =============================================================================


# ─────────────────────────────────────────────────────────────────────────────
# Font & Typography
# ─────────────────────────────────────────────────────────────────────────────

font_family JetBrainsMono Nerd Font Mono
font_size 12.0
shell /usr/bin/zsh

bold_font auto
italic_font auto
bold_italic_font auto

adjust_line_height 115%


# ─────────────────────────────────────────────────────────────────────────────
# Window
# ─────────────────────────────────────────────────────────────────────────────

window_padding_width 14
confirm_os_window_close 0

# Subtle transparency allows the wallpaper to show through.
background_opacity 0.58

# Background blur.
background_blur 32


# ─────────────────────────────────────────────────────────────────────────────
# Cursor
# ─────────────────────────────────────────────────────────────────────────────

cursor_shape beam
cursor_blink_interval 0.6

# Keep the desktop calm and minimal.
cursor_trail 0
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2


# ─────────────────────────────────────────────────────────────────────────────
# Scrollback
# ─────────────────────────────────────────────────────────────────────────────

scrollback_lines 5000


# =============================================================================
# INK & CLOUD — DARK PALETTE
# =============================================================================

foreground #D7D9DA
background #181A1B


# ─────────────────────────────────────────────────────────────────────────────
# Selection
# ─────────────────────────────────────────────────────────────────────────────

selection_foreground #181A1B
selection_background #D7D9DA


# ─────────────────────────────────────────────────────────────────────────────
# Normal
# ─────────────────────────────────────────────────────────────────────────────

color0 #202223  # Black
color1 #A62A2A  # Muted red
color2 #777C80  # Dark gray
color3 #8B9093  # Medium gray
color4 #5B6063  # Charcoal
color5 #6D7275  # Gray
color6 #9A9FA2  # Silver
color7 #C5C8C9  # Light silver


# ─────────────────────────────────────────────────────────────────────────────
# Bright
# ─────────────────────────────────────────────────────────────────────────────

color8  #555A5D  # Dark silver
color9  #C13A3A  # Bright muted red
color10 #8B9093  # Gray
color11 #AEB2B4  # Light gray
color12 #777C80  # Charcoal
color13 #969B9E  # Silver
color14 #C5C8C9  # Light silver
color15 #F2F3F3  # Near-white
```
include themes/noctalia.conf
