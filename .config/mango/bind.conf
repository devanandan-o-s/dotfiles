# Keybinds ported from niri
# Syntax: bind=MODIFIERS,key,action,args

# ---------- Noctalia v5 ----------
bind=SUPER,d,spawn,noctalia msg panel-toggle launcher
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
bind=SUPER,comma,spawn,noctalia msg settings-toggle
bind=SUPER,x,spawn,noctalia msg panel-toggle session
bind=SUPER+SHIFT,v,spawn,noctalia msg panel-toggle clipboard
bind=SUPER,w,spawn,noctalia msg panel-toggle ashur-d/wallpaper-widget:hub
bind=SUPER+ALT,l,spawn,noctalia msg session lock

# ---------- Applications ----------
bind=SUPER,Return,spawn,kitty --directory /home/daito
bind=SUPER,b,spawn,brave-origin
bind=SUPER,y,spawn,kitty -e yazi
bind=SUPER,c,spawn,code
bind=SUPER,e,spawn,nautilus
bind=SUPER,m,spawn,limusic-app
bind=SUPER,t,spawn,Telegram

# ---------- Window / column ----------
bind=SUPER,q,killclient,
bind=ALT,F4,killclient,
bind=SUPER,space,toggleoverview,
bind=SUPER,f,set_proportion,1.0
bind=SUPER+SHIFT,f,togglefullscreen,
bind=SUPER+CTRL,f,set_proportion,1.0
bind=SUPER,v,togglefloating,
bind=SUPER,r,switch_proportion_preset,

bind=SUPER,minus,resizewin,-5,0
bind=SUPER,equal,resizewin,5,0
bind=SUPER+SHIFT,minus,resizewin,0,-5
bind=SUPER+SHIFT,equal,resizewin,0,5

# ---------- Layouts (cycle list is circle_layout in config.conf) ----------
bind=SUPER,n,switch_layout

# ---------- Window switching ----------
bind=ALT,Tab,focusstack,next
bind=ALT+SHIFT,Tab,focusstack,prev

# ---------- Focus ----------
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# ---------- Move windows ----------
bind=SUPER+CTRL,Left,move_client,left
bind=SUPER+CTRL,Right,move_client,right
bind=SUPER+CTRL,Up,move_client,up
bind=SUPER+CTRL,Down,move_client,down
bind=SUPER+CTRL,h,move_client,left
bind=SUPER+CTRL,l,move_client,right
bind=SUPER+CTRL,k,move_client,up
bind=SUPER+CTRL,j,move_client,down

# ---------- Tags (workspaces): plain built-in binds ----------
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+CTRL,1,tag,1
bind=SUPER+CTRL,2,tag,2
bind=SUPER+CTRL,3,tag,3
bind=SUPER+CTRL,4,tag,4
bind=SUPER+CTRL,5,tag,5
bind=SUPER+CTRL,6,tag,6
bind=SUPER+CTRL,7,tag,7
bind=SUPER+CTRL,8,tag,8
bind=SUPER+CTRL,9,tag,9

# ---------- Screenshots ----------
bind=NONE,Print,spawn,/home/daito/.config/mango/bin/screenshot.sh area
bind=CTRL,Print,spawn,/home/daito/.config/mango/bin/screenshot.sh screen
# niri's window screenshot has no equivalent; Noctalia's annotate tool instead
bind=ALT,Print,spawn,noctalia msg screenshot-annotate

# ---------- Audio / media / brightness (work while locked) ----------
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+ -l 1.0
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioStop,spawn,playerctl stop
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioNext,spawn,playerctl next

bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl --class=backlight set +10%
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl --class=backlight set 10%-

# ---------- System ----------
bind=SUPER+SHIFT,e,quit
bind=SUPER+ALT,r,spawn,/home/daito/.config/mango/bin/reload.sh
bind=CTRL+ALT,Delete,spawn,systemctl poweroff

# ---------- Mouse ----------
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
